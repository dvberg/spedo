<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:,">
    <title>SAMC JGVRP Speedometer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="speedometer" class="hud">
        <div id="sync-panel" class="panel sync-panel hide no-drag">
            <div class="panel-head">
                <div class="tabs">
                    <button id="tab-host" class="tab active" type="button">Host</button>
                    <button id="tab-client" class="tab" type="button">Client</button>
                </div>
                <button id="btn-sync-close" class="icon-btn" type="button" title="Tutup">&times;</button>
            </div>
            <div id="sync-host-panel" class="row">
                <div class="code"><span id="sync-host-code">------</span></div>
                <button id="btn-host-connect" class="btn" type="button">Connect</button>
                <button id="btn-host-disconnect" class="btn btn-danger hide" type="button">Disconnect</button>
            </div>
            <div id="sync-client-panel" class="row hide">
                <input id="sync-client-input" type="text" maxlength="6" placeholder="CODE" autocomplete="off">
                <button id="btn-client-connect" class="btn" type="button">Connect</button>
                <button id="btn-client-disconnect" class="btn btn-danger hide" type="button">Disconnect</button>
            </div>
            <div class="sync-status">
                <span id="sync-status-dot" class="status-dot disconnected"></span>
                <span id="sync-status-text">Disconnected</span>
            </div>
        </div>

        <div class="toolbar no-drag">
            <button id="btn-scale-down" class="tool-btn" type="button" title="Perkecil">−</button>
            <button id="btn-reset" class="tool-btn" type="button" title="Reset posisi &amp; ukuran">↺</button>
            <button id="btn-scale-up" class="tool-btn" type="button" title="Perbesar">+</button>
            <button id="btn-sync" class="tool-btn" type="button" title="Sambungkan layar lain">
                <svg viewBox="0 0 24 24" width="12" height="12" fill="currentColor"><path d="M4 6h18V4H4c-1.1 0-2 .9-2 2v11H0v3h14v-3H4V6zm19 2h-6c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h6c.55 0 1-.45 1-1V9c0-.55-.45-1-1-1zm-1 10h-4v-7h4v7z"/></svg>
            </button>
        </div>

        <div class="cluster">
            <div class="rpm">
                <div id="rpm-bar" class="seg-bar"></div>
                <div class="rpm-scale">
                    <span>0</span><span>2</span><span>4</span><span>6</span><span class="hot">8</span><span class="hot">10</span>
                </div>
            </div>

            <div class="main-row">
                <div class="gear"><span id="gear-display">N</span></div>
                <div class="readout">
                    <span id="speed-display">0</span>
                    <span class="unit">MPH</span>
                    <span id="odometer" class="odo">0.0 mi</span>
                </div>
            </div>

            <div class="speed-track"><div id="speed-fill" class="speed-fill"></div></div>

            <div class="stats">
                <div class="stat">
                    <div class="stat-head"><span>FUEL</span><span id="fuel-text">100%</span></div>
                    <div class="bar"><div id="fuel-fill" class="bar-fill"></div></div>
                </div>
                <div class="stat">
                    <div class="stat-head"><span>HEALTH</span><span id="health-text">100%</span></div>
                    <div class="bar"><div id="health-fill" class="bar-fill"></div></div>
                </div>
            </div>

            <div class="indicators">
                <div id="ind-left" class="ind ind-arrow">
                    <svg viewBox="0 0 512 512"><polygon points="316.5,153.6 316.5,18.6 0,256 316.5,493.4 316.5,358.4 512,358.4 512,153.6"/></svg>
                </div>
                <div id="ind-belt" class="ind ind-belt"><span class="chip">BELT</span></div>
                <div id="ind-lights" class="ind ind-lights">
                    <svg viewBox="0 0 256 256"><path d="M144,64V192a16,16,0,0,1-16,16H88A80,80,0,0,1,8,127.4C8.3,83.6,44.6,48,88.9,48H128A16,16,0,0,1,144,64Zm96,104H168a8,8,0,0,0,0,16h72a8,8,0,0,0,0-16ZM168,88h72a8,8,0,0,0,0-16H168a8,8,0,0,0,0,16Zm72,16H168a8,8,0,0,0,0,16h72a8,8,0,0,0,0-16Zm0,32H168a8,8,0,0,0,0,16h72a8,8,0,0,0,0-16Z"/></svg>
                </div>
                <div id="ind-engine" class="ind ind-engine"><span class="chip">ENG</span></div>
                <div id="ind-right" class="ind ind-arrow">
                    <svg viewBox="0 0 512 512"><polygon points="512,256 195.5,18.6 195.5,153.6 0,153.6 0,358.4 195.5,358.4 195.5,493.4"/></svg>
                </div>
            </div>
        </div>
    </div>

    <div id="sync-pill" class="sync-pill hide">
        <span class="pulse-dot"></span>
        <span id="sync-pill-text">Syncing HUD</span>
        <button id="btn-restore-hud" type="button" title="Kembalikan HUD &amp; putuskan">&times;</button>
    </div>

    <button id="btn-music-toggle" class="music-fab no-drag" type="button" title="Music Player" aria-label="Music Player" aria-expanded="false">♫</button>

    <section id="music-panel" class="panel music-panel no-drag hide" aria-label="Music Player">
        <div class="panel-head">
            <strong class="label-amber">Music</strong>
            <button id="btn-music-close" class="icon-btn" type="button" aria-label="Tutup">×</button>
        </div>
        <audio id="music-audio" preload="metadata"></audio>
        <div id="music-track-title" class="music-title">Belum ada lagu</div>
        <div id="music-track-subtitle" class="music-sub">Tempel URL audio</div>
        <div class="music-progress">
            <span id="music-current-time">0:00</span>
            <input id="music-progress" type="range" min="0" max="1000" value="0" step="1" aria-label="Posisi lagu">
            <span id="music-duration">0:00</span>
        </div>
        <div class="music-controls">
            <button id="btn-music-prev" class="icon-btn" type="button" aria-label="Sebelumnya">⏮</button>
            <button id="btn-music-play" class="btn btn-round" type="button" aria-label="Putar">▶</button>
            <button id="btn-music-next" class="icon-btn" type="button" aria-label="Berikutnya">⏭</button>
        </div>
        <div class="music-volume">
            <button id="btn-music-mute" class="icon-btn" type="button" aria-label="Mute">🔊</button>
            <input id="music-volume" type="range" min="0" max="100" value="80" step="1" aria-label="Volume">
            <button id="btn-music-add-toggle" class="icon-btn" type="button" aria-label="Tambah URL lagu">＋</button>
        </div>
        <div id="music-add-row" class="music-add hide">
            <input id="music-url-input" type="url" placeholder="Link audio langsung" autocomplete="off" spellcheck="false">
            <button id="btn-music-add" class="btn" type="button" aria-label="Tambah dan putar">▶</button>
        </div>
        <div class="music-tools">
            <button id="btn-music-repeat" class="tool" type="button" aria-label="Ulangi">↻</button>
            <button id="btn-music-shuffle" class="tool" type="button" aria-label="Acak">⤨</button>
        </div>
        <div class="music-list-head"><span>Playlist</span><button id="btn-music-clear" class="icon-btn" type="button" aria-label="Kosongkan">×</button></div>
        <div id="music-playlist" class="music-list" role="list"></div>
    </section>

    <section id="demo-panel" class="panel demo-panel no-drag hide">
        <div class="demo-title">SAMC SPEEDO TEST</div>
        <label>Speed <input id="demo-speed" type="range" min="0" max="320" value="80"><span id="demo-speed-v">80 km/h</span></label>
        <label>RPM <input id="demo-rpm" type="range" min="0" max="100" value="55"><span id="demo-rpm-v">5.5k</span></label>
        <label>Fuel <input id="demo-fuel" type="range" min="0" max="100" value="75"><span id="demo-fuel-v">75%</span></label>
        <label>Health <input id="demo-health" type="range" min="0" max="100" value="100"><span id="demo-health-v">100%</span></label>
        <div class="demo-buttons">
            <button data-demo="left" type="button">LEFT</button>
            <button data-demo="right" type="button">RIGHT</button>
            <button data-demo="lights" type="button">LIGHTS</button>
            <button data-demo="seatbelt" type="button" class="on">BELT</button>
            <button data-demo="engine" type="button" class="on">ENGINE</button>
            <button data-demo="gear" data-value="-1" type="button">R</button>
            <button data-demo="gear" data-value="0" type="button">N</button>
            <button data-demo="gear" data-value="1" type="button">1</button>
            <button data-demo="gear" data-value="2" type="button">2</button>
            <button data-demo="gear" data-value="3" type="button">3</button>
            <button data-demo="gear" data-value="4" type="button">4</button>
        </div>
    </section>

    <script src="peer.js"></script>
    <script src="js/config.js"></script>
    <script src="js/gauge.js"></script>
    <script src="js/hud.js"></script>
    <script src="js/sync.js"></script>
    <script src="js/music.js"></script>
    <script src="js/demo.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
