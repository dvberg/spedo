<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAMC Mockup - Layout B</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .cluster { width: 320px; padding: 12px 14px 14px; }
        .cluster .rpm { margin-bottom: 12px; }
        .b-center { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
        .b-center .gear { width: 72px; height: 72px; }
        .b-center #gear-display { font-size: 44px; }
        .b-speed { flex: 1; display: flex; flex-direction: column; align-items: center; }
        .b-speed #speed-display { font-size: 72px; font-weight: 700; line-height: .85; letter-spacing: -1px; font-variant-numeric: tabular-nums; }
        .b-sub { display: flex; justify-content: space-between; align-items: center; width: 100%; margin-top: 6px; }
        .b-sub .unit { margin-top: 0; font-size: 9px; letter-spacing: 3px; }
        .b-sub .odo { margin-top: 0; }
        .cluster .stats { margin-top: 12px; }
        .cluster .indicators { margin-top: 12px; padding-top: 10px; }
        .cluster .ind svg { width: 18px; height: 18px; }
    </style>
</head>
<body>
    <div id="speedometer" class="hud">
        <div id="sync-panel" class="panel sync-panel hide no-drag">
            <div class="panel-head">
                <div class="tabs">
                    <button id="sync-role-host" class="tab active" type="button">Host</button>
                    <button id="sync-role-client" class="tab" type="button">Client</button>
                </div>
                <button id="btn-sync-close" class="icon-btn" type="button" aria-label="Tutup"></button>
            </div>
            <div id="sync-host-panel" class="row">
                <div class="code"><span id="sync-host-code">------</span></div>
                <button id="btn-host-connect" class="btn" type="button">Connect</button>
                <button id="btn-host-disconnect" class="btn btn-danger hide" type="button">Disconnect</button>
            </div>
            <div id="sync-client-panel" class="row hide">
                <input id="sync-client-code-input" type="text" maxlength="6" placeholder="CODE" autocomplete="off">
                <button id="btn-sync-connect" class="btn" type="button">Connect</button>
                <button id="btn-sync-disconnect" class="btn btn-danger hide" type="button">Disconnect</button>
            </div>
            <div class="sync-status">
                <span id="sync-status-dot" class="status-dot disconnected"></span>
                <span id="sync-status-text">Disconnected</span>
            </div>
        </div>
        <section id="music-panel" class="panel music-panel no-drag hide" aria-label="Music Player">
            <div class="panel-head"><strong class="label-amber">Music</strong><button id="btn-music-close" class="icon-btn" type="button" aria-label="Tutup"></button></div>
            <audio id="music-audio" preload="metadata"></audio>
            <div class="music-now">
                <div id="music-track-title" class="music-title">Belum ada lagu</div>
                <div id="music-track-subtitle" class="music-sub">Tempel URL audio</div>
            </div>
            <div class="music-progress">
                <span id="music-current-time">0:00</span>
                <input id="music-progress" type="range" min="0" max="1000" value="0" step="1">
                <span id="music-duration">0:00</span>
            </div>
            <div class="music-controls">
                <button id="btn-music-prev" class="icon-btn" type="button" aria-label="Sebelumnya"></button>
                <button id="btn-music-play" class="btn btn-round" type="button" aria-label="Putar"></button>
                <button id="btn-music-next" class="icon-btn" type="button" aria-label="Berikutnya"></button>
            </div>
            <div class="music-volume">
                <button id="btn-music-mute" class="icon-btn" type="button" aria-label="Mute"></button>
                <input id="music-volume" type="range" min="0" max="100" value="80" step="1" aria-label="Volume">
                <button id="btn-music-add-toggle" class="icon-btn" type="button" aria-label="Tambah URL lagu"></button>
            </div>
            <div id="music-add-row" class="music-add hide">
                <input id="music-url-input" type="url" placeholder="Link YouTube atau audio" autocomplete="off">
                <button id="btn-music-add" class="btn" type="button" aria-label="Tambah dan putar"></button>
            </div>
            <div class="music-tools">
                <button id="btn-music-repeat" class="tool" type="button" aria-label="Ulangi"></button>
                <button id="btn-music-shuffle" class="tool" type="button" aria-label="Acak"></button>
            </div>
            <div class="music-list-head"><span>Playlist</span><button id="btn-music-clear" class="icon-btn" type="button" aria-label="Kosongkan"></button></div>
            <div id="music-playlist" class="music-list" role="list"></div>
        </section>
        <div class="topbar">
            <button id="btn-music-toggle" class="music-fab no-drag" type="button" aria-label="Music Player"></button>
            <div class="toolbar no-drag">
                <button id="btn-scale-down" class="tool-btn" type="button" aria-label="Perkecil"></button>
                <button id="btn-reset" class="tool-btn" type="button" aria-label="Reset"></button>
                <button id="btn-scale-up" class="tool-btn" type="button" aria-label="Perbesar"></button>
                <button id="btn-sync" class="tool-btn" type="button" aria-label="Sambungkan"></button>
            </div>
        </div>

        <div class="cluster">
            <div class="rpm">
                <div id="rpm-bar" class="seg-bar"></div>
                <div class="rpm-scale">
                    <span>0</span><span>2</span><span>4</span><span>6</span><span class="hot">8</span><span class="hot">10</span>
                </div>
            </div>

            <div class="b-center">
                <div class="gear"><span id="gear-display">N</span></div>
                <div class="b-speed">
                    <span id="speed-display">0</span>
                    <div class="b-sub">
                        <span class="unit">MPH</span>
                        <span id="odometer" class="odo">0.0 mi</span>
                    </div>
                </div>
            </div>

            <div class="speed-track"><div id="speed-fill" class="speed-fill"></div></div>

            <div class="stats">
                <div class="stat">
                    <div class="stat-head"><span>FUEL</span><span id="fuel-text">100%</span></div>
                    <div class="bar"><div id="fuel-fill" class="bar-fill"></div></div>
                </div>
                <div class="stat">
                    <div class="stat-head"><span>HEALTH</span><span id="health-text">100%</span></div>
                    <div class="bar"><div id="health-fill" class="bar-fill"></div></div>
                </div>
            </div>

            <div class="indicators">
                <div id="indicator-left" class="ind ind-arrow">
                    <svg viewBox="0 0 512 512"><polygon points="316.5,153.6 316.5,18.6 0,256 316.5,493.4 316.5,358.4 512,358.4 512,153.6"/></svg>
                </div>
                <div id="indicator-seatbelt" class="ind ind-belt"><span class="chip">BELT</span></div>
                <div id="indicator-headlights" class="ind ind-lights">
                    <svg viewBox="0 0 256 256"><path d="M144,64V192a16,16,0,0,1-16,16H88A80,80,0,0,1,8,127.4C8.3,83.6,44.6,48,88.9,48H128A16,16,0,0,1,144,64Zm96,104H168a8,8,0,0,0,0,16h72a8,8,0,0,0,0-16ZM168,88h72a8,8,0,0,0,0-16H168a8,8,0,0,0,0,16Zm72,16H168a8,8,0,0,0,0,16h72a8,8,0,0,0,0-16Zm0,32H168a8,8,0,0,0,0,16h72a8,8,0,0,0,0-16Z"/></svg>
                </div>
                <div id="indicator-engine" class="ind ind-engine"><span class="chip">ENG</span></div>
                <div id="indicator-right" class="ind ind-arrow">
                    <svg viewBox="0 0 512 512"><polygon points="512,256 195.5,18.6 195.5,153.6 0,153.6 0,358.4 195.5,358.4 195.5,493.4"/></svg>
                </div>
            </div>
        </div>

        <div id="sync-active-pill" class="sync-pill hide"><span class="pulse-dot"></span><span id="sync-active-text"></span><button id="btn-restore-hud" type="button"></button></div>
    </div>

    <section id="demo-panel" class="panel demo-panel no-drag hide"></section>
    <div id="yt-host" class="yt-host" aria-hidden="true"><div id="yt-player"></div></div>

    <script src="peer.js"></script>
    <script src="app.js"></script>
</body>
</html>
